<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2e8cf" />
  <title>Abhinay</title>
</head>

<body>
  <div id="hero-canvas" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#home" class="brand" data-magnetic>Abhinay G</a>
      <nav aria-label="Main">
        <a href="#squad" data-magnetic>Squad</a>
        <a href="#incoming" data-magnetic>Incoming</a>
        <a href="#setlist" data-magnetic>Setlist</a>
        <a href="#contact" data-magnetic class="nav-offer">Make an offer</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="hero"></section>
    <section id="intro" class="intro">
      <div class="container">
        <h1 data-magnetic>Abhinay G</h1>
      </div>
    </section>
    <section id="squad">
      <div class="container">
        <h2 data-magnetic>The Squad</h2>
        <div class="squad-layout">
          <div id="pitch">
            <svg width="100%" height="100%" viewBox="0 0 68 105" aria-hidden="true" stroke-width="0.4">
              <defs>
                <clipPath id="pitch-clip">
                  <rect x="0" y="0" width="68" height="105" rx="4" />
                </clipPath>
              </defs>
              <g clip-path="url(#pitch-clip)">
                <!-- Base tone: Sage green -->
                <rect class="pitch-bg" x="0" y="0" width="68" height="105" />
                <!-- Subtle mowing stripes: 15% hunter in sage -->
                <g class="pitch-stripes">
                  <rect class="pitch-stripe" x="0" y="10.5" width="68" height="10.5" />
                  <rect class="pitch-stripe" x="0" y="31.5" width="68" height="10.5" />
                  <rect class="pitch-stripe" x="0" y="52.5" width="68" height="10.5" />
                  <rect class="pitch-stripe" x="0" y="73.5" width="68" height="10.5" />
                  <rect class="pitch-stripe" x="0" y="94.5" width="68" height="10.5" />
                </g>
              </g>
              <!-- Tactical lines: Vanilla cream -->
              <g class="pitch-lines" fill="none">
                <rect x="2" y="2" width="64" height="101" rx="2" />
                <line x1="2" y1="52.5" x2="66" y2="52.5" />
                <circle cx="34" cy="52.5" r="9" />
                <circle class="spot" cx="34" cy="52.5" r="0.5" />
                <rect x="14" y="2" width="40" height="16.5" rx="2" />
                <rect x="14" y="86.5" width="40" height="16.5" rx="2" />
                <rect x="25" y="2" width="18" height="5.5" rx="1" />
                <rect x="25" y="97.5" width="18" height="5.5" rx="1" />
                <circle class="spot" cx="34" cy="10.5" r="0.4" />
                <circle class="spot" cx="34" cy="94.5" r="0.4" />
              </g>
            </svg>
          </div>
          <div id="project-card" class="project-card" aria-live="polite"></div>
        </div>
      </div>
    </section>
    <section id="incoming">
      <div class="container">
        <h2 data-magnetic>Incoming</h2>
      </div>
    </section>
    <section id="setlist">
      <div class="container">
        <h2 data-magnetic>The Setlist</h2>
      </div>
    </section>
    <section id="contact">
      <div class="container">
        <h2 data-magnetic>Make an offer</h2>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Abhinaya G</p>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
