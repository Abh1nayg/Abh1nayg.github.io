<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abhinay</title>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#home" class="brand">Abhinay G</a>
      <nav aria-label="Main">
        <a href="#squad">Squad</a>
        <a href="#incoming">Incoming</a>
        <a href="#setlist">Setlist</a>
        <a href="#contact">Make an offer</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="home" class="hero">
      <div id="hero-canvas" aria-hidden="true"></div>
      <p class="hint" aria-hidden="true">Pluck a string</p>
      <div class="container">
        <h1>Abhinay G</h1>
      </div>
    </section>
    <section id="squad">
      <div class="container">
        <h2>The Squad</h2>
        <div id="pitch">
          <svg width="100%" height="100%" viewBox="0 0 68 105" aria-hidden="true" stroke="white" stroke-width="0.4">
            <rect x="0" y="0" width="68" height="105" rx="4" fill="#0f3d2e" stroke="none" />
            <!-- rounded corners -->
            <g class="pitch-lines" fill="none">
              <rect x="2" y="2" width="64" height="101" rx="2" />
              <line x1="2" y1="52.5" x2="66" y2="52.5" />
              <circle cx="34" cy="52.5" r="9" />
              <circle class="spot" cx="34" cy="52.5" r="0.5" />
              <rect x="14" y="2" width="40" height="16.5" rx="2" />
              <rect x="14" y="86.5" width="40" height="16.5" rx="2" />
              <rect x="25" y="2" width="18" height="5.5" rx="1" />
              <rect x="25" y="97.5" width="18" height="5.5" rx="1" />
            </g>
          </svg>
        </div>
      </div>
    </section>
    <section id="incoming">
      <div class="container">
        <h2>Incoming</h2>
      </div>
    </section>
    <section id="setlist">
      <div class="container">
        <h2>The Setlist</h2>
      </div>
    </section>
    <section id="contact">
      <div class="container">
        <h2>Make an offer</h2>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Built by Abhinay.</p>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
